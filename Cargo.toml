[workspace]
members = [
    "crates/reaper-embed",
    "crates/reaper-dioxus",
    "crates/reaper-dioxus-ext",
    "crates/swell-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.82"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://git.starcommand.live/FastTrackStudios/reaper-lib"
authors = ["FastTrack Studio"]

[workspace.dependencies]
# REAPER extension dependencies (FTS fork with v7.63 ruler lane APIs)
reaper-low = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-common-types = { git = "https://git.starcommand.live/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes", features = ["palette"] }

# DAW module system
daw = { path = "../daw/crates/daw" }

# Common
tracing = { version = "0.1", features = ["std"] }
thiserror = "2.0"

# swell-ui dependencies
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
fragile = "2.0.1"
palette = "0.7.3"

# macOS dependencies for swell-ui
objc2 = "=0.3.0-beta.3"
objc2-foundation = "0.2.0"

# Windows dependencies
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

# reaper-embed dependencies
wgpu = { version = "29", features = ["wgsl"] }
vello = { version = "0.9", features = ["wgpu"] }
skrifa = "0.37"
pollster = "0.4"
cocoa = "0.26"
objc = "0.2.7"

# Keep the Blitz native renderer and the embedded Dioxus desktop renderer on
# one Dioxus core. The desktop renderer uses our local fork to expose the
# host-driven Wry bridge, so native's Dioxus dependencies must resolve there
# too when `reaper-dioxus/desktop-renderer` is enabled.
dioxus = { path = "/home/cody/Development/Dioxus/dioxus/packages/dioxus" }
dioxus-asset-resolver = { path = "/home/cody/Development/Dioxus/dioxus/packages/asset-resolver" }
dioxus-cli-config = { path = "/home/cody/Development/Dioxus/dioxus/packages/cli-config" }
dioxus-config-macros = { path = "/home/cody/Development/Dioxus/dioxus/packages/config-macros" }
dioxus-core = { path = "/home/cody/Development/Dioxus/dioxus/packages/core" }
dioxus-core-macro = { path = "/home/cody/Development/Dioxus/dioxus/packages/core-macro" }
dioxus-core-types = { path = "/home/cody/Development/Dioxus/dioxus/packages/core-types" }
dioxus-devtools = { path = "/home/cody/Development/Dioxus/dioxus/packages/devtools" }
dioxus-devtools-types = { path = "/home/cody/Development/Dioxus/dioxus/packages/devtools-types" }
dioxus-document = { path = "/home/cody/Development/Dioxus/dioxus/packages/document" }
dioxus-history = { path = "/home/cody/Development/Dioxus/dioxus/packages/history" }
dioxus-hooks = { path = "/home/cody/Development/Dioxus/dioxus/packages/hooks" }
dioxus-html = { path = "/home/cody/Development/Dioxus/dioxus/packages/html" }
dioxus-html-internal-macro = { path = "/home/cody/Development/Dioxus/dioxus/packages/html-internal-macro" }
dioxus-rsx = { path = "/home/cody/Development/Dioxus/dioxus/packages/rsx" }
dioxus-signals = { path = "/home/cody/Development/Dioxus/dioxus/packages/signals" }
dioxus-stores = { path = "/home/cody/Development/Dioxus/dioxus/packages/stores" }
dioxus-stores-macro = { path = "/home/cody/Development/Dioxus/dioxus/packages/stores-macro" }
generational-box = { path = "/home/cody/Development/Dioxus/dioxus/packages/generational-box" }
manganis = { path = "/home/cody/Development/Dioxus/dioxus/packages/manganis/manganis" }
manganis-core = { path = "/home/cody/Development/Dioxus/dioxus/packages/manganis/manganis-core" }
manganis-macro = { path = "/home/cody/Development/Dioxus/dioxus/packages/manganis/manganis-macro" }
