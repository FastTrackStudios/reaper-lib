[package]
name = "reaper-dioxus"
version = "0.1.0"
edition = "2024"
description = "Dioxus-native overlay rendering for REAPER extensions"

[dependencies]
reaper-embed = { path = "../reaper-embed" }

# REAPER API access (low-level for docking, SWELL window management)
reaper-low.workspace = true

# Dioxus-native with blitz rendering
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", features = ["prelude"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git" }

# Rendering pipeline
anyrender_vello = "0.6"
vello.workspace = true
wgpu.workspace = true

# Utilities
futures-util = "0.3"
crossbeam = "0.8"
raw-window-handle = "0.6"
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "allow"
